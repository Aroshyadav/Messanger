
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | chatNut</title>
  <link rel="stylesheet" href="signup.css">
</head>

<body>
  <section class="signup-hero">
    <h1>Welcome Back</h1>
    <p>Login to start chatting.</p>

    <div class="signup-wrapper">
      <div id="error-container" class="error-msg">
        Invalid email or password. Please try again.
      </div>

      <form class="signup-form" id="auth-form" action="/login" method="POST">
        <div class="input-card">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="input-card">
          <label for="password">Password</label>
          <div class="password-field"> <input type="password" id="password" name="password" required>
            <i class="fa-solid fa-eye" id="togglePassword"></i>
          </div>
        </div>

        <button type="submit" id="auth-btn" class="signup-btn login-style">
          <span class="loader"></span>
          <span class="btn-text">Login</span>
        </button>

        <p class="login-text">Don't have an account? <a href="signup.html">Sign Up</a></p>
      </form>
    </div>
  </section>

  <script>
    const authForm = document.getElementById('auth-form');
    const authBtn = document.getElementById('auth-btn');
    const togglePassword = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#password');

    // Toggle Password Visibility
    togglePassword.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.classList.toggle('fa-eye-slash'); // Add slash icon when showing
    });

    // Loading State on Submit
    authForm.addEventListener('submit', () => {
      authBtn.classList.add('is-loading');
      authBtn.disabled = true;
      authBtn.querySelector('.btn-text').innerText = "Connecting...";
    });

    // Check for URL Errors
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error')) {
      document.getElementById('error-container').style.display = 'block';
    }
  </script>
</body>

</html>
